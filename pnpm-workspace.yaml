packages:
  - apps/*
  - packages/*
  - tooling
catalogMode: prefer
catalog:
  "@better-auth/api-key": "1.7.23"
  "@better-auth/oauth-provider": "1.7.23"
  "@better-auth/passkey": "1.7.23"
  "@orpc/client": ^1.16.2
  "@orpc/server": ^1.16.2
  "@types/node": ^26.6.6
  "@types/pg": "^8.23.1"
  "@types/react": "^19.3.0"
  "@types/react-dom": "^19.3.0"
  "@uiw/color-convert": "^2.10.3"
  "ai": ^7.0.172
  "bcryptjs": "^3.0.3"
  "better-auth": "1.7.23"
  "drizzle-orm": "1.0.0-rc.4"
  "es-toolkit": ^1.53.2
  esbuild: ^0.28.2
  "fflate": "^0.8.3"
  "ioredis": "^6.0.0"
  "jsonrepair": "^3.15.0"
  "pg": "^8.23.1"
  "react": "19.3.1"
  "ts-pattern": ^5.9.2
  "tsrs": "0.25.0-ts7.1.0-beta"
  "typescript": "^7.0.2"
  "vite-plus": "1.6.0"
  "zod": ^4.6.7
  "@fontsource-variable/figtree": ^5.3.0
  "@fontsource-variable/geist-mono": ^5.3.0
  "@fontsource/instrument-serif": ^5.3.0
  "@shadcn/react": ^0.3.1
  pdf-lib: 1.17.1
allowBuilds:
  esbuild: true
  lefthook: true
  sharp: true
minimumReleaseAge: 0
overrides:
  # One React copy across the workspace: transitive ^19 ranges would otherwise pull in a newer react-dom.
  react: 19.3.1
  react-dom: 19.3.1
  # Plugins take @better-auth/core as a peer; keep it on better-auth's own version so their types line up.
  "@better-auth/core": 1.7.23
  # Keep plugin imports on the same Vite and Vitest instances as Vite+.
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vitest: 5.1.0
  next@<16.3.8: 16.3.8
  "@modelcontextprotocol/client@>=2.0.0 <2.2.0": ^2.2.0
  postcss-selector-parser@<7.1.6: ^7.1.6
  esbuild@>=0.17.0 <0.28.1: ^0.28.1
  postcss@<8.5.10: ^8.5.14
  samlify@<2.13.0: ^2.13.0
  uuid@<11.1.1: ^11.1.1
  dompurify@<3.4.17: ^3.4.17
  node-forge@<1.4.1: ^1.4.2
  zod@>=4.0.0 <4.6.6: ^4.6.7
peerDependencyRules:
  # Vite+ ships its own Vite and Vitest builds (the overrides above); plugins' Vite/Vitest peer ranges don't name them.
  allowAny:
    - vite
    - vitest
patchedDependencies:
  deepmerge@4.3.1: patches/deepmerge@4.3.1.patch
