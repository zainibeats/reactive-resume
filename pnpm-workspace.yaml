packages:
  - apps/*
  - packages/*
  - tooling
catalogMode: prefer
catalog:
  "@better-auth/api-key": "1.7.12"
  "@better-auth/oauth-provider": "1.7.12"
  "@better-auth/passkey": "1.7.12"
  "@orpc/client": ^1.16.1
  "@orpc/server": ^1.16.1
  "@types/node": ^26.6.5
  "@types/pg": "^8.23.1"
  "@types/react": "^19.3.0"
  "@types/react-dom": "^19.3.0"
  "@uiw/color-convert": "^2.10.3"
  "ai": ^7.0.153
  "bcryptjs": "^3.0.3"
  "better-auth": "1.7.12"
  "drizzle-orm": "1.0.0-rc.4"
  "es-toolkit": ^1.53.0
  "fflate": "^0.8.3"
  "ioredis": "^6.0.0"
  "jsonrepair": "^3.15.0"
  "pg": "^8.23.1"
  "react": "19.3.0"
  "ts-pattern": ^5.9.2
  "tsrs": "0.18.0-ts7.1.0-dev.20260929"
  "typescript": "^7.0.2"
  "vite-plus": "1.3.0"
  "zod": ^4.6.7
allowBuilds:
  esbuild: true
  lefthook: true
  sharp: true
minimumReleaseAge: 0
overrides:
  # One React copy across the workspace: transitive ^19 ranges would otherwise pull in a newer react-dom.
  react: 19.3.0
  react-dom: 19.3.0
  # Plugins take @better-auth/core as a peer; keep it on better-auth's own version so their types line up.
  "@better-auth/core": 1.7.12
  # Keep plugin imports on the same Vite and Vitest instances as Vite+.
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vitest: 5.0.5
  next@<16.3.8: 16.3.8
  "@modelcontextprotocol/client@>=2.0.0 <2.2.0": ^2.2.0
  postcss-selector-parser@<7.1.6: ^7.1.6
  esbuild@>=0.17.0 <0.28.1: ^0.28.1
  postcss@<8.5.10: ^8.5.14
  samlify@<2.13.0: ^2.13.0
  uuid@<11.1.1: ^11.1.1
  dompurify@<3.4.17: ^3.4.17
