services:
  postgres:
    image: postgres:latest
    container_name: reactive-resume-postgres
    restart: unless-stopped
    networks:
      - data_network
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "postgres"]
      start_period: 10s
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:latest
    container_name: reactive-resume-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    networks:
      - data_network
    # Exposed on localhost because the app container uses host networking.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      start_period: 5s
      interval: 30s
      timeout: 10s
      retries: 3

  reactive_resume:
    # image: ghcr.io/amruthpillai/reactive-resume:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reactive-resume-ui
    network_mode: host
    env_file:
      - path: .env
        required: true
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@localhost:5432/postgres
      - REDIS_URL=redis://localhost:6379
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));"]
      start_period: 10s
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:

networks:
  data_network:
